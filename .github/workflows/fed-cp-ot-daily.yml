name: Fed CP OT daily ingest

# UTC cron covers 13:30-18:00 ET in both EDT (UTC-4: 17:30-22:00) and EST (UTC-5: 18:30-23:00).
# The gate step decides in America/New_York time, so the extra firings are skipped.
on:
  schedule:
    - cron: '30 17 * * 1-5'
    - cron: '0,30 18-22 * * 1-5'
    - cron: '0 23 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Skip the time/holiday/already-ingested gate'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fed-cp-ot-daily
  cancel-in-progress: false

env:
  TRACK: tracks/fed-cp-ot
  GH_TOKEN: ${{ github.token }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit manifest/diff/forward-log; create/upload release assets
      issues: write     # alert issue on missing asset / chain failure / schema change
    outputs:
      run: ${{ steps.gate.outputs.run }}
    defaults:
      run:
        working-directory: tracks/fed-cp-ot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tracks/fed-cp-ot/requirements.txt
      - run: pip install -r requirements.txt

      - name: Gate (ET window, Fed holiday, already ingested)
        id: gate
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python -m fed_cp_ot.daily verify --issue
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            python -m fed_cp_ot.daily gate --issue
          fi

      - name: Fetch vintage (sha256, fetch time UTC, Last-Modified -> manifest)
        if: steps.gate.outputs.run == 'true'
        run: python -m fed_cp_ot.daily fetch --issue

      - name: Parse and validate (fails on schema/column/attribute change)
        if: steps.gate.outputs.run == 'true'
        run: python -m fed_cp_ot.daily validate --issue

      - name: Diff against previous vintage
        if: steps.gate.outputs.run == 'true'
        run: python -m fed_cp_ot.daily diff --issue

      - name: Store raw zip as release asset
        if: steps.gate.outputs.run == 'true'
        run: python -m fed_cp_ot.daily upload --issue

      - name: Build app (burn-in/placeholder only)
        if: steps.gate.outputs.run == 'true'
        run: python -m fed_cp_ot.daily build-app --issue

      - name: Commit manifest, diffs and forward log only
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name 'fed-cp-ot-bot'
          git config user.email 'fed-cp-ot-bot@users.noreply.github.com'
          git add -- data/manifest.jsonl data/vintage_diffs.jsonl
          [ -f data/forward_log.jsonl ] && git add -- data/forward_log.jsonl
          if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
          git commit -m "fed-cp-ot: daily ingest $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.run == 'true'
        with:
          path: docs

  deploy:
    needs: ingest
    if: needs.ingest.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
