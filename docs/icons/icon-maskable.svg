    <linearGradient id="glass" x1="22%" y1="10%" x2="86%" y2="90%">
      <stop offset="0%" stop-color="#FFFBF3" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#E8DCC6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#C9B79A" stop-opacity="0.18"/>
